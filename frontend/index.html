<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#360061" />
    <meta
      name="description"
      content="Internal cluster diagnostics dashboard for SingleStore Support Engineers"
    />
    <link rel="icon" href="%BASE_URL%assets/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/favicon.svg" />
    <title>SingleStore Report Sniffer v1</title>
    <script>
      window.addEventListener(
        "error",
        function (e) {
          if (
            e.error instanceof DOMException &&
            e.error.name === "DataCloneError" &&
            e.error.message &&
            e.error.message.includes("PerformanceServerTiming")
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
