name: desktop-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require tag and desktop package version to match
        run: node -e "const p=require('./desktop/package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match desktop version v'+p.version)"

  build-and-publish:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
          - os: macos-14
            target: mac-arm64
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Build frontend and backend
        shell: bash
        env:
          PYTHON_BIN: python3.11
          S2RS_COMPONENTS_ONLY: "1"
        run: bash scripts/build-desktop.sh
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build installer (unsigned)
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          case "${{ matrix.target }}" in
            mac-x64) npx --no-install electron-builder --mac dmg zip --x64 --publish never ;;
            mac-arm64) npx --no-install electron-builder --mac dmg zip --arm64 --publish never ;;
            win-x64) npx --no-install electron-builder --win nsis --x64 --publish never ;;
            linux-x64) npx --no-install electron-builder --linux AppImage deb --x64 --publish never ;;
          esac
      - name: Generate checksums
        shell: bash
        working-directory: desktop/dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -print0 | sort -z | xargs -0 shasum -a 256 > "SHA256SUMS-${{ matrix.target }}"
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
            desktop/dist/*.yaml
            desktop/dist/*.blockmap
            desktop/dist/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify complete platform set
        shell: bash
        run: |
          test -n "$(find release-artifacts -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release-artifacts -maxdepth 1 -name '*.deb' -print -quit)"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/*
      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* --repo "shahidstermain/S2-report-sniffer" --title "${GITHUB_REF_NAME}" --generate-notes
