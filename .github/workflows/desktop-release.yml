name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match desktop/package.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require tag and desktop package version to match
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node -e "const p=require('./desktop/package.json'); if ('v'+p.version !== process.env.RELEASE_TAG) throw new Error('Tag '+process.env.RELEASE_TAG+' does not match desktop version v'+p.version)"

  build-and-publish:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
          - os: macos-14
            target: mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Build frontend and backend
        shell: bash
        env:
          PYTHON_BIN: python
          S2RS_COMPONENTS_ONLY: "1"
        run: bash scripts/build-desktop.sh
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build installer (unsigned)
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          case "${{ matrix.target }}" in
            mac-x64) npx --no-install electron-builder --mac dmg zip --x64 --publish never ;;
            mac-arm64) npx --no-install electron-builder --mac dmg zip --arm64 --publish never ;;
          esac
      - name: Preserve architecture update manifest
        shell: bash
        working-directory: desktop/dist
        run: mv latest-mac.yml "latest-${{ matrix.target }}.yml"
      - name: Generate checksums
        shell: bash
        working-directory: desktop/dist
        run: python ../../scripts/generate_checksums.py "SHA256SUMS-${{ matrix.target }}"
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
            desktop/dist/*.yaml
            desktop/dist/*.blockmap
            desktop/dist/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Merge macOS update manifests
        run: |
          python scripts/merge_mac_update_manifests.py \
            release-artifacts/latest-mac.yml \
            release-artifacts/latest-mac-x64.yml \
            release-artifacts/latest-mac-arm64.yml
          cd release-artifacts
          python ../scripts/generate_checksums.py SHA256SUMS-macos
      - name: Verify complete macOS set
        shell: bash
        run: |
          test "$(find release-artifacts -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-artifacts -maxdepth 1 -name '*-mac.zip' | wc -l | tr -d ' ')" -eq 2
          test -f release-artifacts/SHA256SUMS-mac-x64
          test -f release-artifacts/SHA256SUMS-mac-arm64
          test -f release-artifacts/SHA256SUMS-macos
          test -f release-artifacts/latest-mac.yml
      - name: Publish macOS-only release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" release-artifacts/* \
            --repo "shahidstermain/S2-report-sniffer" \
            --title "S2 Report Sniffer ${RELEASE_TAG}" \
            --generate-notes
