name: desktop-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require tag and desktop package version to match
        run: node -e "const p=require('./desktop/package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match desktop version v'+p.version)"

  build-and-publish:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: mac-x64
          - os: macos-14
            target: mac-arm64
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Require signing credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          test -n "$RELEASE_GH_TOKEN"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            test -n "$WINDOWS_CERTIFICATE_BASE64" && test -n "$WINDOWS_CERT_PASSWORD" && test -n "$WINDOWS_PUBLISHER_NAME"
          fi
      - name: Materialize Windows signing certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          cert_path="$RUNNER_TEMP/s2rs-windows-signing.pfx"
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          echo "WINDOWS_CERT_PATH=$cert_path" >> "$GITHUB_ENV"
      - name: Build frontend and backend
        shell: bash
        env:
          PYTHON_BIN: python3.11
          S2RS_COMPONENTS_ONLY: "1"
        run: bash scripts/build-desktop.sh
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and publish signed installer
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          case "${{ matrix.target }}" in
            mac-x64) npx --no-install electron-builder --mac dmg zip --x64 --publish onTagOrDraft ;;
            mac-arm64) npx --no-install electron-builder --mac dmg zip --arm64 --publish onTagOrDraft ;;
            win-x64) npx --no-install electron-builder --win nsis --x64 --publish onTagOrDraft ;;
            linux-x64) npx --no-install electron-builder --linux AppImage deb --x64 --publish onTagOrDraft ;;
          esac
