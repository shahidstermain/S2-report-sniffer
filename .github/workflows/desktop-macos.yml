name: desktop-macos-dmg

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - scripts/build-desktop.sh
      - scripts/build-macos-arm64-dmg.sh
      - scripts/smoke-test-backend.sh
      - backend/s2rs-backend.spec
      - s2rs-backend.spec
      - backend/requirements.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/desktop-macos.yml

jobs:
  build-macos-dmg:
    name: Build unsigned macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Build desktop (unsigned DMG)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          PYTHON_BIN="$(command -v python3.11 || command -v python3)"
          export PYTHON_BIN
          bash scripts/build-desktop.sh

      - name: List installer artifacts
        run: |
          echo "== desktop/dist =="
          find desktop/dist -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -print 2>/dev/null || true
          echo "== dist/installers =="
          find dist/installers -maxdepth 1 -type f -print 2>/dev/null || true
          ls -lh dist/backend/s2rs-backend 2>/dev/null || true

      - name: Upload unsigned macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: S2ReportSniffer-macos-unsigned-dmg
          path: |
            dist/installers/*.dmg
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
