[mypy]
ignore_missing_imports = True
exclude = (?x)(\.venv|venv|build|dist|migrations|alembic|test_.*)

# Dynamic parser code uses dict.get() extensively; full strict mode would
# require hundreds of type: ignore comments. We enable checking for the
# typed API layer (server.py, storage.py) and leave the parser/checker
# layer relaxed for dynamic dict access patterns.
[mypy-parsers]
check_untyped_defs = False
disable_error_code = assignment, index, operator, union-attr, attr-defined, var-annotated, call-overload, arg-type, return-value, misc, has-type

[mypy-glean_mcp]
check_untyped_defs = False
disable_error_code = assignment, attr-defined, index, operator, misc, arg-type, var-annotated, union-attr, return-value

[mypy-superchecker]
check_untyped_defs = False
disable_error_code = var-annotated, assignment, index, arg-type, union-attr

[mypy-monitoring]
check_untyped_defs = False
disable_error_code = annotation-unchecked, var-annotated, arg-type, misc, has-type

[mypy-rollback_runner]
check_untyped_defs = False
disable_error_code = arg-type, union-attr, call-overload

[mypy-validators]
check_untyped_defs = False
disable_error_code = arg-type, assignment